<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- استيراد خط كوفي عربي عريض ومميز من جوجل -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&amp;display=swap');
      .kufi-text {
        font-family: 'Reem Kufi', sans-serif;
        font-weight: 700;
        font-size: 54px;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: middle;
        letter-spacing: 1px;
        filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.4));
      }
    </style>
  </defs>

  <!-- خلفية الأيقونة -->
  <rect width="512" height="512" rx="100" fill="#1b4332"/>
  
  <!-- رمز الهلال في الأعلى -->
  <text x="50%" y="38%" font-size="150" text-anchor="middle" dominant-baseline="middle">🌙</text>
  
  <!-- النص بخط الكوفي العريض تحت الهلال -->
  <text x="50%" y="78%" class="kufi-text">كن مع الله</text>
</svg>
